name: GitHub Profile 3D Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate 3D contribution profile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Keep only the profile animation used by README
        run: |
          find profile-3d-contrib -type f ! -name "profile-season-animate.svg" -delete

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No 3D profile changes."
          else
            git commit -m "chore: update 3D contribution profile"
            git push
          fi