  <path d="M166 313h180" stroke="url(#gold)" stroke-width="2" opacity=".8"/>
  <text x="256" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="5" fill="#f8edcc">RUTHISHKUMAR G.</text>
