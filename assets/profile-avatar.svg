  <path d="M116 338 A168 168 0 0 0 396 338" fill="none" stroke="url(#gold)" stroke-width="2" opacity=".8"/>
  <g fill="none" stroke="url(#gold)" stroke-width="2" opacity=".7">
    <path d="M92 256h45M375 256h45M256 92v24M256 396v24"/>
    <circle cx="86" cy="256" r="4" fill="#f1d58a"/>
    <circle cx="426" cy="256" r="4" fill="#f1d58a"/>
