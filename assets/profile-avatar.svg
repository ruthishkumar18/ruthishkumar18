<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Ruthishkumar G. profile avatar</title>
  <desc id="desc">A professional black and gold monogram avatar with RK initials.</desc>
  <defs>
    <radialGradient id="bg" cx="35%" cy="25%" r="85%">
      <stop offset="0" stop-color="#29251a"/>
      <stop offset=".55" stop-color="#11110f"/>
      <stop offset="1" stop-color="#030303"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b0"/>
      <stop offset=".38" stop-color="#d6ad50"/>
      <stop offset=".72" stop-color="#f5d77c"/>
