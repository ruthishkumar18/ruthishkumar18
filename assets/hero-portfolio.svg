<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 600" role="img" aria-label="Ruthishkumar G portfolio hero">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset=".48" stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#06b6d4"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ddd6fe"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="1500" height="600" rx="34" fill="url(#bg)"/>

<!-- perspective grid -->
<g opacity=".15" stroke="#38bdf8" stroke-width="1">
  <path d="M0 500H1500M0 440H1500M0 380H1500M0 320H1500M0 260H1500M0 200H1500M0 140H1500"/>
  <path d="M120 0L0 600M300 0L180 600M480 0L360 600M660 0L540 600M840 0L720 600M1020 0L900 600M1200 0L1080 600M1380 0L1260 600"/>
</g>

<!-- floating particles -->
<g fill="#67e8f9" opacity=".8">
  <circle cx="820" cy="85" r="4"><animate attributeName="cy" values="85;62;85" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="1260" cy="110" r="3"><animate attributeName="cy" values="110;78;110" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="930" cy="520" r="4"><animate attributeName="cy" values="520;492;520" dur="3.8s" repeatCount="indefinite"/></circle>
  <circle cx="1320" cy="440" r="3"><animate attributeName="cy" values="440;415;440" dur="2.8s" repeatCount="indefinite"/></circle>
</g>

<!-- 3D visual cluster -->
<g transform="translate(1110 305)" filter="url(#glow)">
  <ellipse rx="270" ry="92" fill="none" stroke="#22d3ee" stroke-width="3" opacity=".38">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse rx="220" ry="135" fill="none" stroke="#8b5cf6" stroke-width="2" opacity=".38">
    <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse rx="155" ry="205" fill="none" stroke="#f59e0b" stroke-width="2" opacity=".24">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
  </ellipse>

  <!-- central 3D cube -->
  <g>
    <polygon points="0,-105 92,-53 92,53 0,105 -92,53 -92,-53" fill="#0f172a" stroke="#67e8f9" stroke-width="4"/>
    <polygon points="0,-105 92,-53 0,0 -92,-53" fill="url(#cyan)" opacity=".82"/>
    <polygon points="-92,-53 0,0 0,105 -92,53" fill="#0e7490" opacity=".92"/>
    <polygon points="0,0 92,-53 92,53 0,105" fill="#312e81" opacity=".94"/>
    <animateTransform attributeName="transform" type="rotate" values="0;10;0;-10;0" dur="5s" repeatCount="indefinite"/>
  </g>

  <!-- upper floating cube -->
  <g transform="translate(190 -115)">
    <polygon points="0,-42 40,-21 40,21 0,42 -40,21 -40,-21" fill="url(#violet)" stroke="#c4b5fd" stroke-width="3"/>
    <polygon points="0,-42 40,-21 0,0 -40,-21" fill="#a78bfa" opacity=".5"/>
    <polygon points="-40,-21 0,0 0,42 -40,21" fill="#4c1d95" opacity=".8"/>
    <polygon points="0,0 40,-21 40,21 0,42" fill="#312e81" opacity=".9"/>
    <animateTransform attributeName="transform" type="rotate" values="0;360" dur="9s" repeatCount="indefinite"/>
  </g>

  <!-- right mini cube -->
  <g transform="translate(185 120)">
    <polygon points="0,-32 30,-16 30,16 0,32 -30,16 -30,-16" fill="url(#gold)" stroke="#fde68a" stroke-width="2"/>
    <animateTransform attributeName="transform" type="rotate" values="0;360" dur="7s" repeatCount="indefinite"/>
  </g>

  <!-- left mini cube -->
  <g transform="translate(-190 90)">
    <polygon points="0,-28 27,-14 27,14 0,28 -27,14 -27,-14" fill="url(#cyan)" stroke="#67e8f9" stroke-width="2"/>
    <animateTransform attributeName="transform" type="rotate" values="360;0" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- orbiting nodes -->
  <circle cx="270" cy="0" r="7" fill="#67e8f9">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="-250" cy="0" r="6" fill="#a78bfa">
    <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="-190" r="6" fill="#fbbf24">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- main content -->
<g transform="translate(70 78)" font-family="Arial,Helvetica,sans-serif">
  <text fill="#67e8f9" font-size="16" font-weight="700" letter-spacing="4">OPEN TO INTERNSHIPS &amp; COLLABORATIONS</text>
  <text y="80" fill="#ffffff" font-size="64" font-weight="800">RUTHISHKUMAR G</text>
  <text y="128" fill="#a5f3fc" font-size="25" font-weight="700">AI &amp; FULL STACK DEVELOPER</text>
  <text y="169" fill="#94a3b8" font-size="17">Building Intelligent Systems with AI &amp; Code.</text>

  <!-- stats -->
  <g transform="translate(0 205)">
    <g>
      <rect width="175" height="82" rx="17" fill="#0b1220" stroke="#164e63"/>
      <text x="18" y="28" fill="#64748b" font-size="11" font-weight="700">CGPA</text>
      <text x="18" y="62" fill="#ffffff" font-size="30" font-weight="800">8.52</text>
    </g>
    <g transform="translate(190)">
      <rect width="175" height="82" rx="17" fill="#0b1220" stroke="#164e63"/>
      <text x="18" y="28" fill="#64748b" font-size="11" font-weight="700">INTERNSHIPS</text>
      <text x="18" y="62" fill="#ffffff" font-size="30" font-weight="800">3</text>
    </g>
    <g transform="translate(380)">
      <rect width="205" height="82" rx="17" fill="#0b1220" stroke="#3730a3"/>
      <text x="18" y="28" fill="#64748b" font-size="11" font-weight="700">MAJOR AI/ML PROJECTS</text>
      <text x="18" y="62" fill="#ffffff" font-size="30" font-weight="800">2</text>
    </g>
    <g transform="translate(600)">
      <rect width="190" height="82" rx="17" fill="#0b1220" stroke="#92400e"/>
      <text x="18" y="28" fill="#64748b" font-size="11" font-weight="700">INDUSTRY PROJECT</text>
      <text x="18" y="62" fill="#ffffff" font-size="30" font-weight="800">1</text>
    </g>
  </g>

  <g transform="translate(0 330)">
    <rect width="160" height="40" rx="20" fill="#083344" stroke="#155e75"/>
    <text x="25" y="26" fill="#67e8f9" font-size="14" font-weight="700">PORTFOLIO</text>
    <rect x="175" width="145" height="40" rx="20" fill="#111827" stroke="#3730a3"/>
    <text x="205" y="26" fill="#c4b5fd" font-size="14" font-weight="700">LINKEDIN</text>
    <rect x="335" width="125" height="40" rx="20" fill="#111827" stroke="#334155"/>
    <text x="369" y="26" fill="#e2e8f0" font-size="14" font-weight="700">GITHUB</text>
  </g>
</g>
</svg>