<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" role="img" aria-label="Industrial software and PLC systems">
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#020617"/><stop offset=".5" stop-color="#0f172a"/><stop offset="1" stop-color="#111827"/></linearGradient>
  <linearGradient id="metal" x2="1" y2="1"><stop stop-color="#334155"/><stop offset=".45" stop-color="#0f172a"/><stop offset="1" stop-color="#475569"/></linearGradient>
  <linearGradient id="amber" x2="1" y2="1"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
  <linearGradient id="cyan" x2="1" y2="1"><stop stop-color="#06b6d4"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="700" height="330" rx="26" fill="url(#bg)"/>

<!-- industrial perspective grid -->
<g opacity=".14" stroke="#f59e0b">
  <path d="M0 265H700M0 225H700M0 185H700M0 145H700M0 105H700"/>
  <path d="M55 0L0 330M175 0L120 330M295 0L240 330M415 0L360 330M535 0L480 330M655 0L600 330"/>
</g>

<!-- header -->
<g transform="translate(30 34)" font-family="Arial,Helvetica,sans-serif">
  <text fill="#fbbf24" font-size="12" font-weight="700" letter-spacing="3">INDUSTRIAL SOFTWARE</text>
  <text y="34" fill="#fff" font-size="21" font-weight="800">PLC &amp; REAL-TIME SYSTEMS</text>
  <text y="62" fill="#94a3b8" font-size="12">ReactJS • Django ORM • MSSQL • PLC • DEPLOYMENT</text>
</g>

<!-- PLC machine -->
<g transform="translate(510 142)" filter="url(#glow)">
  <ellipse cx="0" cy="96" rx="125" ry="26" fill="#000" opacity=".28"/>

  <!-- cabinet -->
  <polygon points="-86,-82 65,-82 100,-50 -52,-50" fill="#475569" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="-86,-82 -52,-50 -52,82 -86,50" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <polygon points="-52,-50 100,-50 100,82 -52,82" fill="url(#metal)" stroke="#64748b" stroke-width="2"/>

  <!-- panel -->
  <rect x="-30" y="-27" width="94" height="66" rx="10" fill="#020617" stroke="#22d3ee" stroke-width="2"/>
  <rect x="-18" y="-15" width="70" height="40" rx="5" fill="#07111f" stroke="#164e63"/>
  <path d="M-6 0H12M20 0H39M-6 11H32M-6 22H17" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>
  <circle cx="-12" cy="-50" r="6" fill="#22d3ee">
    <animate attributeName="r" values="4;9;4" dur="1.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="48" cy="-50" r="6" fill="#f59e0b">
    <animate attributeName="r" values="4;9;4" dur="2.1s" repeatCount="indefinite"/>
  </circle>

  <!-- signal lines -->
  <path d="M-112-8H-86M100-8H132M-112 25H-86M100 25H132" stroke="#22d3ee" stroke-width="3"/>
  <circle cx="-116" cy="-8" r="5" fill="#67e8f9"><animate attributeName="cx" values="-116;-88;-116" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="138" cy="25" r="5" fill="#fbbf24"><animate attributeName="cx" values="138;108;138" dur="2s" repeatCount="indefinite"/></circle>

  <!-- base conveyor -->
  <polygon points="-125,82 105,82 145,103 -88,103" fill="#0b1220" stroke="#334155"/>
  <path d="M-85 91H102" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <g fill="#22d3ee">
    <circle cx="-62" cy="91" r="7"><animate attributeName="cx" values="-62;91;-62" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="-20" cy="91" r="7"><animate attributeName="cx" values="-20;133;-20" dur="4s" begin=".5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- floating 3D data blocks -->
  <g transform="translate(-146 -92)">
    <polygon points="0,-18 22,-7 0,4 -22,-7" fill="#0891b2" stroke="#67e8f9"/>
    <polygon points="-22,-7 0,4 0,28 -22,17" fill="#0e7490" stroke="#22d3ee"/>
    <polygon points="0,4 22,-7 22,17 0,28" fill="#164e63" stroke="#22d3ee"/>
    <animateTransform attributeName="transform" type="rotate" values="0;360" dur="7s" repeatCount="indefinite"/>
  </g>

  <g transform="translate(145 -118)">
    <polygon points="0,-15 18,-6 0,3 -18,-6" fill="#b45309" stroke="#fde68a"/>
    <polygon points="-18,-6 0,3 0,22 -18,13" fill="#92400e" stroke="#f59e0b"/>
    <polygon points="0,3 18,-6 18,13 0,22" fill="#78350f" stroke="#f59e0b"/>
    <animateTransform attributeName="transform" type="rotate" values="360;0" dur="8s" repeatCount="indefinite"/>
  </g>
</g>

<!-- left mini architecture -->
<g transform="translate(35 165)" font-family="monospace">
  <rect width="260" height="105" rx="18" fill="#0b1220" stroke="#164e63"/>
  <text x="18" y="24" fill="#64748b" font-size="11">SYSTEM FLOW</text>
  <text x="18" y="48" fill="#67e8f9" font-size="12">PLC → API → DATABASE</text>
  <text x="18" y="70" fill="#a5b4fc" font-size="12">ReactJS → Django ORM</text>
  <text x="18" y="92" fill="#fbbf24" font-size="12">MSSQL → REAL-TIME UI</text>
  <circle cx="242" cy="18" r="4" fill="#22d3ee"><animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite"/></circle>
</g>
</svg>