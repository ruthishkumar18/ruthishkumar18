<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 430" role="img" aria-label="Technical Arsenal">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020617"/><stop offset=".5" stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient>
<linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
<linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ddd6fe"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
<linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fde68a"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<rect width="1400" height="430" rx="30" fill="url(#bg)"/>

<!-- perspective grid -->
<g opacity=".11" stroke="#38bdf8">
<path d="M0 360H1400M0 315H1400M0 270H1400M0 225H1400M0 180H1400M0 135H1400M0 90H1400"/>
<path d="M90 0L0 430M260 0L170 430M430 0L340 430M600 0L510 430M770 0L680 430M940 0L850 430M1110 0L1020 430M1280 0L1190 430"/>
</g>

<!-- content -->
<g transform="translate(62 52)" font-family="Arial,Helvetica,sans-serif">
<text fill="#67e8f9" font-size="15" font-weight="700" letter-spacing="4">TECHNICAL ARSENAL</text>
<text y="52" fill="#fff" font-size="38" font-weight="800">BUILD • INTEGRATE • DEPLOY</text>
<text y="86" fill="#94a3b8" font-size="15">A practical stack spanning AI, vision, web engineering, data and deployment.</text>

<!-- programming -->
<rect y="115" width="735" height="47" rx="15" fill="#0b1220" stroke="#164e63"/>
<circle cx="24" cy="138" r="8" fill="#67e8f9"><animate attributeName="r" values="6;11;6" dur="2s" repeatCount="indefinite"/></circle>
<text x="45" y="133" fill="#67e8f9" font-size="11" font-weight="700">PROGRAMMING</text>
<text x="45" y="151" fill="#e2e8f0" font-size="13">Python • C • JavaScript • HTML5 • CSS3</text>

<!-- AI -->
<rect y="173" width="735" height="47" rx="15" fill="#0b1220" stroke="#3730a3"/>
<circle cx="24" cy="196" r="8" fill="#a78bfa"><animate attributeName="r" values="6;11;6" dur="2.4s" repeatCount="indefinite"/></circle>
<text x="45" y="191" fill="#c4b5fd" font-size="11" font-weight="700">AI / ML / DEEP LEARNING</text>
<text x="45" y="209" fill="#e2e8f0" font-size="13">YOLO • CNN • Random Forest • Neural Networks • ResNet • Vision Transformer</text>

<!-- frameworks -->
<rect y="231" width="735" height="47" rx="15" fill="#0b1220" stroke="#164e63"/>
<circle cx="24" cy="254" r="8" fill="#22d3ee"><animate attributeName="r" values="6;11;6" dur="2.2s" repeatCount="indefinite"/></circle>
<text x="45" y="249" fill="#67e8f9" font-size="11" font-weight="700">FRAMEWORKS</text>
<text x="45" y="267" fill="#e2e8f0" font-size="13">ReactJS • Flask • Django ORM • Streamlit • Node.js</text>

<!-- databases -->
<rect y="289" width="735" height="47" rx="15" fill="#0b1220" stroke="#92400e"/>
<circle cx="24" cy="312" r="8" fill="#f59e0b"><animate attributeName="r" values="6;11;6" dur="2.6s" repeatCount="indefinite"/></circle>
<text x="45" y="307" fill="#fbbf24" font-size="11" font-weight="700">DATABASES</text>
<text x="45" y="325" fill="#e2e8f0" font-size="13">MySQL • PostgreSQL • MSSQL • MongoDB • SQLite3 • Firebase • ThingSpeak</text>

<!-- tools -->
<text y="378" fill="#64748b" font-size="12">TOOLS: Git • GitHub • LM Studio • Google Colab • Roboflow • Android Studio • Jira</text>
</g>

<!-- 3D stack -->
<g transform="translate(1090 218)" filter="url(#glow)">
<!-- orbit -->
<ellipse rx="245" ry="90" fill="none" stroke="#22d3ee" stroke-width="2" opacity=".35">
<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
</ellipse>
<ellipse rx="185" ry="125" fill="none" stroke="#8b5cf6" stroke-width="2" opacity=".3">
<animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="11s" repeatCount="indefinite"/>
</ellipse>

<!-- Python-like cube -->
<g>
<polygon points="0,-82 78,-42 0,-2 -78,-42" fill="#0e7490" stroke="#67e8f9" stroke-width="3"/>
<polygon points="-78,-42 0,-2 0,80 -78,40" fill="#164e63" stroke="#67e8f9" stroke-width="3"/>
<polygon points="0,-2 78,-42 78,40 0,80" fill="#312e81" stroke="#a78bfa" stroke-width="3"/>
<text x="-33" y="35" fill="#fff" font-family="monospace" font-size="21" font-weight="700">PY</text>
<animateTransform attributeName="transform" type="rotate" values="0;8;0;-8;0" dur="5s" repeatCount="indefinite"/>
</g>

<!-- AI floating cube -->
<g transform="translate(155 -105)">
<polygon points="0,-38 36,-19 0,0 -36,-19" fill="url(#violet)" stroke="#c4b5fd" stroke-width="2"/>
<polygon points="-36,-19 0,0 0,38 -36,19" fill="#4c1d95"/>
<polygon points="0,0 36,-19 36,19 0,38" fill="#312e81"/>
<text x="-12" y="7" fill="#fff" font-family="monospace" font-size="14">AI</text>
<animateTransform attributeName="transform" type="rotate" values="0;360" dur="8s" repeatCount="indefinite"/>
</g>

<!-- database cylinder -->
<g transform="translate(168 102)">
<ellipse rx="42" ry="14" fill="#0e7490" stroke="#67e8f9" stroke-width="2"/>
<path d="M-42 0V53C-42 69 42 69 42 53V0" fill="#083344" stroke="#67e8f9" stroke-width="2"/>
<ellipse cy="53" rx="42" ry="14" fill="#0e7490" stroke="#67e8f9" stroke-width="2"/>
<ellipse cy="26" rx="42" ry="14" fill="none" stroke="#155e75" stroke-width="2"/>
<circle cx="26" cy="-6" r="4" fill="#67e8f9"><animate attributeName="opacity" values=".2;1;.2" dur="1.5s" repeatCount="indefinite"/></circle>
<animateTransform attributeName="transform" type="rotate" values="-4;4;-4" dur="6s" repeatCount="indefinite"/>
</g>

<!-- frontend cube -->
<g transform="translate(-175 85)">
<polygon points="0,-32 30,-16 0,0 -30,-16" fill="url(#cyan)"/>
<polygon points="-30,-16 0,0 0,32 -30,16" fill="#0e7490"/>
<polygon points="0,0 30,-16 30,16 0,32" fill="#164e63"/>
<text x="-13" y="8" fill="#fff" font-family="monospace" font-size="13">&lt;/&gt;</text>
<animateTransform attributeName="transform" type="rotate" values="360;0" dur="7s" repeatCount="indefinite"/>
</g>

<!-- orbit particles -->
<circle cx="245" cy="-15" r="6" fill="#67e8f9"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="-220" cy="-30" r="5" fill="#a78bfa"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="5s" repeatCount="indefinite"/></circle>
<circle cx="15" cy="-180" r="5" fill="#fbbf24"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/></circle>
</g>
</svg>